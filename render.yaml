# Render Blueprint: New → Blueprint → select this repository.
# Free plan: the service sleeps after ~15 min idle (first visit then takes about
# a minute) and has no persistent disk, so online rooms reset on every restart or
# deploy. Solo games live in each browser and are not affected.
services:
  - type: web
    name: pocket-four-souls
    runtime: node
    plan: free
    branch: master
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Render sets PORT; the server must listen on every interface.
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_PATH
        value: data/rooms.sqlite
